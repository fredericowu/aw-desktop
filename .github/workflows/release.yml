name: Desktop Release

# macOS needs a REAL macOS runner for code signing + notarization — unlike
# this org's Linux bare-metal CI runners, GitHub-hosted macOS is used here
# on purpose (same reasoning as aw-meta-glasses-2's ios.yml). Windows has no
# equivalent signing requirement yet (no EV cert) but still needs its own
# native runner to produce a real nsis .exe.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: aw-desktop-release
  cancel-in-progress: false

# electron-builder's GitHub publisher needs to create/update the Release —
# the repo's default GITHUB_TOKEN permission is read-only, so without this
# the publish step 403s even with --publish always.
permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT_B64: ${{ secrets.ASC_KEY_CONTENT_B64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK_RAW: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # CSC_IDENTITY_AUTO_DISCOVERY=false does NOT just disable discovering
      # a stray identity in an otherwise-empty keychain — electron-builder's
      # findIdentity() (app-builder-lib macCodeSign.js) returns null
      # WITHOUT EVER CALLING `security find-identity` whenever this is
      # "false" and no CSC_NAME is set, even for a certificate explicitly
      # imported from CSC_LINK. Verified live (run 43588646501, card
      # 4185bf3b-9510-81b7-bc0b-e515a9dad5dd): a real, valid, correctly-
      # chained Developer ID cert from CSC_LINK was imported successfully,
      # manually confirmed found by `security find-identity -v -p
      # codesigning`, yet electron-builder still logged "skipped macOS
      # application code signing" and produced an unsigned build — because
      # this flag short-circuits identity lookup before it ever inspects
      # the keychain. So it must track whether CSC_LINK actually has a
      # cert for electron-builder to find, not stay hardcoded "false".
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Bundle workspace UI
        # aw-workspace-ui is public; AW_UI_REPO_TOKEN is optional.
        env:
          AW_UI_REPO_TOKEN: ${{ secrets.AW_UI_REPO_TOKEN }}
        run: bash scripts/fetch-ui.sh

      - name: Typecheck + unit tests
        run: npm run typecheck && npm test

      - name: Write App Store Connect API key
        if: env.ASC_KEY_CONTENT_B64 != ''
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_CONTENT_B64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Export code-signing certificate
        # electron-builder's getCscLink() treats an EMPTY CSC_LINK as an
        # explicit (if useless) file path, not "unset" — it resolves to
        # the repo root and crashes with "<cwd> not a file" instead of
        # skipping signing. GitHub interpolates a missing secret to "",
        # not absent, so CSC_LINK must only ever be exported into the
        # real environment when the secret is genuinely non-empty.
        #
        # Decode straight to a file rather than writing the raw base64
        # into $GITHUB_ENV (same pattern as the ASC key above) — the
        # single-line KEY=VALUE format of $GITHUB_ENV silently truncates
        # at the first embedded newline, and plain `base64` (unlike
        # `base64 -w0`) wraps its output every 76 chars. A truncated
        # base64 blob decodes to a corrupted .p12 that fails PKCS12
        # import with a "MAC verification failed (wrong password?)"
        # error indistinguishable from an actually-wrong password.
        if: env.CSC_LINK_RAW != ''
        run: |
          mkdir -p "$RUNNER_TEMP/csc"
          printf '%s' "$CSC_LINK_RAW" | base64 --decode > "$RUNNER_TEMP/csc/cert.p12"

      - name: Re-export cert.p12 in a Keychain-compatible format
        # CSC_LINK's .p12 was built with a modern OpenSSL (3.x) default:
        # PBES2/PBKDF2/AES-256-CBC content encryption + SHA-256 MAC.
        # Verified live (run 43588421771, card 4185bf3b-9510-81b7-bc0b-
        # e515a9dad5dd): macOS's `security import` — the old CDSA-based
        # Keychain Services crypto, NOT modern OpenSSL — cannot parse that
        # scheme at all and reports it identically to a wrong password
        # ("MAC verification failed ... wrong password?"), even though
        # `openssl pkcs12 -info` on this very runner parses the same file
        # and verifies its MAC fine with the real CSC_KEY_PASSWORD. The
        # runner's own openssl (LibreSSL, which never adopted the PBES2
        # default and so is Keychain-compatible on write) can read the
        # modern file and re-export it in the old RC2/3DES+SHA1 scheme
        # `security import` understands — no new credential material
        # needed, just a format conversion of what's already in CSC_LINK.
        if: env.CSC_LINK_RAW != ''
        run: |
          openssl pkcs12 -in "$RUNNER_TEMP/csc/cert.p12" -nodes -passin "pass:$CSC_KEY_PASSWORD" -out "$RUNNER_TEMP/csc/combined.pem"
          openssl pkcs12 -export -in "$RUNNER_TEMP/csc/combined.pem" -out "$RUNNER_TEMP/csc/cert-legacy.p12" -passout "pass:$CSC_KEY_PASSWORD" -name "Developer ID Application"
          rm -f "$RUNNER_TEMP/csc/combined.pem"
          echo "CSC_LINK=$RUNNER_TEMP/csc/cert-legacy.p12" >> "$GITHUB_ENV"

      - name: Build + package
        # Always publishes to the GitHub Release on a tag push — signing
        # (CSC_LINK) and notarization (ASC_*) stay independently gated
        # inside electron-builder.yml / build/notarize.js; an unsigned DMG
        # is still a real, downloadable artifact, just Gatekeeper-warned.
        run: npm run build && npx electron-builder --mac --publish never

      - name: Notarize + staple DMG, verify, publish
        # electron-builder signs the DMG (dmg.sign) but only the .app is
        # notarized by afterSign; the DMG container is notarized + stapled
        # here, verified, then every mac asset is uploaded to the Release.
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash build/finalize-dmg.sh "${GITHUB_REF_NAME}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aw-desktop-mac-${{ env.CSC_LINK != '' && 'signed' || 'unsigned' }}
          path: dist/*.dmg

  release-windows:
    # Serialized after macOS so both jobs don't race creating the same
    # GitHub Release for this tag — electron-builder's GitHub publisher
    # creates the release on first publish, then reuses it on subsequent
    # ones; running both at once risks two concurrent "create" attempts.
    needs: release-macos
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Bundle workspace UI
        # aw-workspace-ui is public; AW_UI_REPO_TOKEN is optional.
        env:
          AW_UI_REPO_TOKEN: ${{ secrets.AW_UI_REPO_TOKEN }}
        shell: bash
        run: bash scripts/fetch-ui.sh

      - name: Build
        run: npm run build

      - name: Package + publish (unsigned — no code-signing cert yet)
        run: npx electron-builder --win --publish always

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aw-desktop-windows-unsigned
          path: dist/*.exe
