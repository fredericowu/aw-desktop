name: Desktop Release

# macOS needs a REAL macOS runner for code signing + notarization — unlike
# this org's Linux bare-metal CI runners, GitHub-hosted macOS is used here
# on purpose (same reasoning as aw-meta-glasses-2's ios.yml). Windows has no
# equivalent signing requirement yet (no EV cert) but still needs its own
# native runner to produce a real nsis .exe.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: aw-desktop-release
  cancel-in-progress: false

# electron-builder's GitHub publisher needs to create/update the Release —
# the repo's default GITHUB_TOKEN permission is read-only, so without this
# the publish step 403s even with --publish always.
permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT_B64: ${{ secrets.ASC_KEY_CONTENT_B64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK_RAW: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Belt-and-suspenders: guards electron-builder from trying to
      # auto-discover a signing identity from the runner's empty keychain.
      # Only governs keychain auto-discovery, not an explicitly-exported
      # CSC_LINK above — safe to leave on once real signing is added.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Write App Store Connect API key
        if: env.ASC_KEY_CONTENT_B64 != ''
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_CONTENT_B64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Export code-signing certificate
        # electron-builder's getCscLink() treats an EMPTY CSC_LINK as an
        # explicit (if useless) file path, not "unset" — it resolves to
        # the repo root and crashes with "<cwd> not a file" instead of
        # skipping signing. GitHub interpolates a missing secret to "",
        # not absent, so CSC_LINK must only ever be exported into the
        # real environment when the secret is genuinely non-empty.
        #
        # Decode straight to a file rather than writing the raw base64
        # into $GITHUB_ENV (same pattern as the ASC key above) — the
        # single-line KEY=VALUE format of $GITHUB_ENV silently truncates
        # at the first embedded newline, and plain `base64` (unlike
        # `base64 -w0`) wraps its output every 76 chars. A truncated
        # base64 blob decodes to a corrupted .p12 that fails PKCS12
        # import with a "MAC verification failed (wrong password?)"
        # error indistinguishable from an actually-wrong password.
        if: env.CSC_LINK_RAW != ''
        run: |
          mkdir -p "$RUNNER_TEMP/csc"
          printf '%s' "$CSC_LINK_RAW" | base64 --decode > "$RUNNER_TEMP/csc/cert.p12"
          echo "CSC_LINK=$RUNNER_TEMP/csc/cert.p12" >> "$GITHUB_ENV"

      - name: TEMP debug - cert.p12 sanity check
        # One-off diagnostic for the signing-credential investigation on
        # card 4185bf3b-9510-81b7-bc0b-e515a9dad5dd — reveals only size,
        # a hash, and openssl's own (non-secret) diagnostic text, never
        # the secret content itself. Remove once resolved.
        if: env.CSC_LINK_RAW != ''
        run: |
          echo "cert.p12 size: $(wc -c < "$RUNNER_TEMP/csc/cert.p12") bytes"
          echo "cert.p12 sha256: $(shasum -a 256 "$RUNNER_TEMP/csc/cert.p12" | awk '{print $1}')"
          echo "cert.p12 first 16 bytes (hex): $(head -c 16 "$RUNNER_TEMP/csc/cert.p12" | xxd -p | tr -d '\n')"
          echo "CSC_KEY_PASSWORD length: ${#CSC_KEY_PASSWORD}"
          openssl pkcs12 -in "$RUNNER_TEMP/csc/cert.p12" -info -noout -passin "pass:$CSC_KEY_PASSWORD" -legacy 2>&1 || true
          echo "--- retry without -legacy ---"
          openssl pkcs12 -in "$RUNNER_TEMP/csc/cert.p12" -info -noout -passin "pass:$CSC_KEY_PASSWORD" 2>&1 || true

      - name: Build + package
        # Always publishes to the GitHub Release on a tag push — signing
        # (CSC_LINK) and notarization (ASC_*) stay independently gated
        # inside electron-builder.yml / build/notarize.js; an unsigned DMG
        # is still a real, downloadable artifact, just Gatekeeper-warned.
        run: npm run build && npx electron-builder --mac --publish always

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aw-desktop-mac-${{ env.CSC_LINK != '' && 'signed' || 'unsigned' }}
          path: dist/*.dmg

  release-windows:
    # Serialized after macOS so both jobs don't race creating the same
    # GitHub Release for this tag — electron-builder's GitHub publisher
    # creates the release on first publish, then reuses it on subsequent
    # ones; running both at once risks two concurrent "create" attempts.
    needs: release-macos
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package + publish (unsigned — no code-signing cert yet)
        run: npx electron-builder --win --publish always

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aw-desktop-windows-unsigned
          path: dist/*.exe
