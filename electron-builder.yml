appId: com.fredericowu.awdesktop
productName: AW Desktop
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
# Bundled workspace UI build served by the loopback front server (see src/main/localWorkspaces.ts uiStaticDir).
# Populated at release time from aw-workspace-ui; absent in dev (use AW_DESKTOP_UI_DIR).
extraResources:
  - from: resources/ui
    to: ui
protocols:
  name: AW Desktop
  schemes:
    - awdesktop
asarUnpack:
  - out/renderer/**/*
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Developer ID Application cert, not Apple Distribution — this app is
  # notarized direct-download, never Mac App Store (Architect card
  # 4175bf3b-9510-8104-8c21-f5008b4d708b §3/§4). electron-builder reads the
  # cert from CSC_LINK/CSC_KEY_PASSWORD (base64 .p12 + its password), same
  # "secret holds the credential, CI decodes it" shape as
  # aw-meta-glasses-2's ASC_KEY_CONTENT_B64 — see .github/workflows/release.yml.
afterSign: build/notarize.js
# The DMG container itself must be Developer ID signed (AC6); it is then
# notarized + stapled by build/finalize-dmg.sh after electron-builder runs.
dmg:
  sign: true
win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: "${productName}-Setup-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: fredericowu
  repo: aw-desktop
  # electron-builder's GitHub publisher creates a DRAFT release by
  # default — invisible/undownloadable to anyone without repo write
  # access. A direct-download app needs a real, public release the
  # moment a tag is pushed.
  releaseType: release
